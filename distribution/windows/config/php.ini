[PHP]
engine = On
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 512M
max_execution_time = 120
post_max_size = 20M
upload_max_filesize = 16M
date.timezone = UTC
extension_dir = "ext"

extension = curl
extension = fileinfo
extension = intl
extension = mbstring
extension = openssl
extension = pdo_pgsql
extension = pgsql
extension = sodium
extension = zip

[Session]
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

[Assertion]
zend.assertions = -1
