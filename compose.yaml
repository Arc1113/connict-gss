name: graduation-stage-system

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command:
            - php
            - artisan
            - serve
            - --host=0.0.0.0
            - --port=8000
        depends_on:
            database:
                condition: service_healthy
        environment:
            DB_HOST: database
            DB_PORT: 5432
            HOME: /tmp
        ports:
            - "${APP_BIND_HOST:-127.0.0.1}:${APP_FORWARD_PORT:-8000}:8000"
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        volumes:
            - .:/app
        working_dir: /app

    reverb:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command:
            - php
            - artisan
            - reverb:start
            - --host=0.0.0.0
            - --port=8080
        depends_on:
            database:
                condition: service_healthy
        environment:
            DB_HOST: database
            DB_PORT: 5432
            HOME: /tmp
        healthcheck:
            test:
                - CMD
                - php
                - -r
                - "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"
            interval: 2s
            timeout: 5s
            retries: 15
        ports:
            - "${APP_BIND_HOST:-127.0.0.1}:${REVERB_FORWARD_PORT:-8080}:8080"
        restart: unless-stopped
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        volumes:
            - .:/app
        working_dir: /app

    tts-worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command:
            - php
            - artisan
            - queue:work
            - database
            - --queue=tts-preparation
            - --sleep=1
            - --tries=1
            - --timeout=180
            - --max-time=3600
        depends_on:
            database:
                condition: service_healthy
            local-tts:
                condition: service_healthy
        environment:
            DB_HOST: database
            DB_PORT: 5432
            HOME: /tmp
        restart: unless-stopped
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        volumes:
            - .:/app
        working_dir: /app

    local-tts:
        build:
            context: .
            dockerfile: docker/local-tts/Dockerfile
        environment:
            HF_HUB_OFFLINE: "1"
            TRANSFORMERS_OFFLINE: "1"
            TRANSFORMERS_CACHE: /tmp/transformers
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=2)"
            interval: 10s
            timeout: 3s
            retries: 12
            start_period: 90s
        mem_limit: 3g
        pids_limit: 256
        read_only: true
        restart: unless-stopped
        tmpfs:
            # The offline English phonemizer copies libespeak-ng into its
            # isolated temp directory before loading it. Without `exec`,
            # unfamiliar names and Latin honors are silently omitted.
            - /tmp:size=256m,mode=1777,exec

    database:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: "${DB_DATABASE:-graduation_stage_system}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
            POSTGRES_TEST_DB: "${DB_TEST_DATABASE:-graduation_stage_system_testing}"
            POSTGRES_USER: "${DB_USERNAME:-gss_app}"
        healthcheck:
            test:
                - CMD-SHELL
                - "pg_isready -U ${DB_USERNAME:-gss_app} -d ${DB_DATABASE:-graduation_stage_system}"
            interval: 2s
            timeout: 5s
            retries: 15
        ports:
            - "127.0.0.1:${DB_FORWARD_PORT:-54329}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init-testing-database.sh:/docker-entrypoint-initdb.d/10-testing-database.sh:ro

volumes:
    postgres-data:
