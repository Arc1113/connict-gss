name: Windows release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package, for example 1.0.0
        required: true
        type: string
      signing_mode:
        description: Test builds an explicitly unsigned preview; trusted requires configured signing secrets
        required: true
        default: test
        type: choice
        options:
          - test
          - trusted
  push:
    tags: ['v*.*.*']

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: graduation_stage_system_testing
          POSTGRES_USER: gss_app
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gss_app -d graduation_stage_system_testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'fileinfo, pgsql, mbstring, intl, zip, bcmath' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate --force
      - run: npm run lint
      - run: npm run build
      - run: vendor/bin/pint --test
      - run: php artisan test --compact
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: graduation_stage_system_testing
          DB_USERNAME: gss_app
          DB_PASSWORD: test-password

  package:
    needs: validate
    runs-on: windows-2022
    environment: windows-release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release-inputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve approved release inputs
        id: release-inputs
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_SIGNING_MODE: ${{ inputs.signing_mode }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $version = $env:DISPATCH_VERSION
          if ([string]::IsNullOrWhiteSpace($version) -and $env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ([string]::IsNullOrWhiteSpace($version) -and $env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $version = "0.0.$env:GITHUB_RUN_NUMBER-pr$env:PULL_REQUEST_NUMBER"
          }
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw 'A semantic release version is required. Tags must use vX.Y.Z.'
          }

          $signingMode = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            'trusted'
          } elseif ([string]::IsNullOrWhiteSpace($env:DISPATCH_SIGNING_MODE)) {
            'test'
          } else {
            $env:DISPATCH_SIGNING_MODE
          }
          if ($signingMode -notin @('test', 'trusted')) {
            throw 'Signing mode must be test or trusted.'
          }

          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
          "signing_mode=$signingMode" | Add-Content -Path $env:GITHUB_OUTPUT
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'fileinfo, pgsql, mbstring, intl, zip, bcmath' }
      - name: Verify PHP packaging extensions
        shell: pwsh
        run: |
          $loadedExtensions = @(php -r "echo implode(PHP_EOL, get_loaded_extensions());")
          foreach ($extension in @('fileinfo', 'pgsql', 'mbstring', 'intl', 'zip', 'bcmath')) {
            if ($extension -notin $loadedExtensions) {
              throw "Required PHP extension is unavailable: $extension"
            }
          }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: docker/local-tts/requirements.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Prepare trusted code-signing certificate
        if: steps.release-inputs.outputs.signing_mode == 'trusted'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'connict-gss-signing.pfx'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Trusted Windows builds require the code-signing certificate secrets.'
          }
          if ($env:SIGNING_TIMESTAMP_URL -notmatch '^https://') {
            throw 'WINDOWS_SIGNING_TIMESTAMP_URL must be an HTTPS URL for trusted builds.'
          }
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $certificatePassword = $env:SIGNING_CERTIFICATE_PASSWORD
          "CONNICT_GSS_SIGNING_TIMESTAMP_URL=$env:SIGNING_TIMESTAMP_URL" | Add-Content -Path $env:GITHUB_ENV
          "CONNICT_GSS_SIGNING_CERTIFICATE_PATH=$certificatePath" | Add-Content -Path $env:GITHUB_ENV
          "CONNICT_GSS_SIGNING_CERTIFICATE_PASSWORD=$certificatePassword" | Add-Content -Path $env:GITHUB_ENV
      - name: Build verified Windows runtime
        shell: pwsh
        env:
          RELEASE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          ./distribution/windows/scripts/Get-ConnictGssRuntimeInputs.ps1
          ./distribution/windows/scripts/Build-ConnictGssOfflineTts.ps1 -PythonCommand python
          ./distribution/windows/scripts/Register-ConnictGssTtsRuntime.ps1 `
            -Version 'kokoro-0.9.4-f3ff3571' `
            -SourceUrl $env:RELEASE_SOURCE_URL `
            -LicenseRecord 'Generated license inventory included; release-owner approval required for production distribution' `
            -Verification "GitHub-Actions-attestation:$env:GITHUB_RUN_ID; source-commit:$env:RELEASE_SOURCE_COMMIT"
          ./distribution/windows/scripts/New-ConnictGssRuntimeManifest.ps1
      - name: Build and sign installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-inputs.outputs.version }}
          SIGNING_MODE: ${{ steps.release-inputs.outputs.signing_mode }}
        run: |
          $releaseParameters = @{
            Version = $env:RELEASE_VERSION
          }
          if ($env:SIGNING_MODE -eq 'trusted') {
            $releaseParameters.RequireCodeSigning = $true
          } else {
            $env:CONNICT_GSS_FAST_BUILD = '1'
          }
          ./distribution/windows/scripts/Build-ConnictGssRelease.ps1 @releaseParameters
      - name: Install and initialize release candidate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-inputs.outputs.version }}
          GSS_INITIAL_INSTITUTION_NAME: Connict GSS Release Validation
          GSS_INITIAL_ADMIN_NAME: Release Administrator
          GSS_INITIAL_ADMIN_EMAIL: release-validation@example.test
          GSS_INITIAL_ADMIN_PASSWORD: ReleaseValidation-2026!
        run: |
          $installer = Resolve-Path "distribution/windows/installer/Output/ConnictGSS-Setup-$env:RELEASE_VERSION.exe"
          $installLog = Join-Path $env:RUNNER_TEMP 'connict-gss-install.log'
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/LOG=$installLog"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)." }

          $installRoot = Join-Path $env:ProgramFiles 'Connict GSS'
          # GitHub-hosted Windows runners reserve port 80. Keep the production
          # Caddy template on port 80, but use a high HTTP redirect port for CI.
          $caddyTemplatePath = Join-Path $installRoot 'config/Caddyfile'
          $caddyTemplate = Get-Content -LiteralPath $caddyTemplatePath -Raw
          $caddyTemplate = $caddyTemplate.Replace('http://__GSS_HTTPS_HOST__ {', 'http://__GSS_HTTPS_HOST__:8081 {')
          [IO.File]::WriteAllText($caddyTemplatePath, $caddyTemplate, [Text.UTF8Encoding]::new($false))
          $initializeScript = Join-Path $installRoot 'scripts/Initialize-ConnictGss.ps1'
          $initializeArguments = "-NoProfile -ExecutionPolicy Bypass -File `"$initializeScript`" -InstallRoot `"$installRoot`""
          $initialization = Start-Process -FilePath 'powershell.exe' -ArgumentList $initializeArguments -Verb RunAs -Wait -PassThru
          if ($initialization.ExitCode -ne 0) {
            $setupError = Join-Path $env:ProgramData 'ConnictGSS/logs/setup-error.json'
            if (Test-Path -LiteralPath $setupError) {
              Get-Content -LiteralPath $setupError -Raw | Write-Error
            }
            throw 'First-run initialization failed.'
          }

          & (Join-Path $installRoot 'scripts/Invoke-ConnictGssBackup.ps1') -InstallRoot $installRoot
          if ($LASTEXITCODE -ne 0) { throw 'Release validation backup failed.' }

          $healthScript = Join-Path $installRoot 'scripts/Test-ConnictGssHealth.ps1'
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            $health = & $healthScript | ConvertFrom-Json
            $ready = $health.database -and $health.web -and $health.reverb -and $health.tts -and $health.certificate -and $health.services.'ConnictGSS-Queue'
            if ($ready) { break }
            if ($attempt -eq 30) {
              $health | ConvertTo-Json -Depth 5 | Write-Host
              throw 'Installed services did not become healthy within 150 seconds.'
            }
            Start-Sleep -Seconds 5
          }

          & (Join-Path $installRoot 'scripts/Test-ConnictGssCleanMachine.ps1') -InstallRoot $installRoot -RequireTts
          if ($LASTEXITCODE -ne 0) { throw 'Clean-machine release validation failed.' }
      - name: Collect Windows validation evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = 'distribution/windows/validation-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $installLog = Join-Path $env:RUNNER_TEMP 'connict-gss-install.log'
          if (Test-Path -LiteralPath $installLog) {
            Copy-Item -LiteralPath $installLog -Destination $evidence -Force
          }
          $dataRoot = Join-Path $env:ProgramData 'ConnictGSS'
          foreach ($relative in 'status.json', 'logs', 'diagnostics') {
            $source = Join-Path $dataRoot $relative
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination $evidence -Recurse -Force
            }
          }
          foreach ($source in @(
            'distribution/windows/runtime-input/runtime-manifest.json',
            'distribution/windows/runtime-input/runtime-provenance.json',
            'distribution/windows/runtime-input/tts/bundle-manifest.json',
            'distribution/windows/runtime-input/tts/THIRD_PARTY_NOTICES.txt',
            'distribution/windows/runtime-input/tts/licenses/license-inventory.json'
          )) {
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination $evidence -Force
            }
          }
      - name: Upload Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ConnictGSS-Windows-validation-${{ steps.release-inputs.outputs.version }}-${{ steps.release-inputs.outputs.signing_mode }}
          path: distribution/windows/validation-evidence
          if-no-files-found: warn
      - name: Stop validation services
        if: always()
        shell: pwsh
        run: |
          $stopScript = Join-Path $env:ProgramFiles 'Connict GSS/scripts/Stop-ConnictGssServices.ps1'
          if (Test-Path -LiteralPath $stopScript) { & $stopScript }
          if ($env:CONNICT_GSS_SIGNING_CERTIFICATE_PATH) {
            Remove-Item -LiteralPath $env:CONNICT_GSS_SIGNING_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }
      - name: Write installer checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-inputs.outputs.version }}
        run: |
          $installer = "distribution/windows/installer/Output/ConnictGSS-Setup-$env:RELEASE_VERSION.exe"
          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum *$(Split-Path -Leaf $installer)" | Set-Content -LiteralPath "$installer.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: ConnictGSS-Setup-${{ steps.release-inputs.outputs.version }}-${{ steps.release-inputs.outputs.signing_mode }}
          path: |
            distribution/windows/installer/Output/ConnictGSS-Setup-${{ steps.release-inputs.outputs.version }}.exe
            distribution/windows/installer/Output/ConnictGSS-Setup-${{ steps.release-inputs.outputs.version }}.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release-inputs.outputs.version }}
        run: |
          gh release create "v$env:RELEASE_VERSION" `
            "distribution/windows/installer/Output/ConnictGSS-Setup-$env:RELEASE_VERSION.exe" `
            "distribution/windows/installer/Output/ConnictGSS-Setup-$env:RELEASE_VERSION.exe.sha256" `
            --title "Connict GSS v$env:RELEASE_VERSION" `
            --generate-notes
