<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title description">
  <title id="title">Abstract graduation procession</title>
  <desc id="description">Layered warm gold ribbons move across a deep green field.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d302b"/>
      <stop offset="1" stop-color="#071b19"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c89242"/>
      <stop offset=".5" stop-color="#f0d39a"/>
      <stop offset="1" stop-color="#a56c27"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="640" height="320" fill="url(#field)"/>
  <path d="M-40 246C78 171 165 286 278 205s199-54 402-185" fill="none" stroke="#e8c787" stroke-opacity=".2" stroke-width="72" filter="url(#soft)"/>
  <path d="M-30 262C93 172 168 292 286 204S493 158 674-8" fill="none" stroke="url(#ribbon)" stroke-width="18"/>
  <path d="M-20 290C116 213 184 317 302 237S497 200 665 68" fill="none" stroke="#f5e4bb" stroke-opacity=".65" stroke-width="3"/>
  <g fill="#f5e4bb" fill-opacity=".78">
    <circle cx="103" cy="231" r="4"/>
    <circle cx="250" cy="236" r="3"/>
    <circle cx="395" cy="184" r="5"/>
    <circle cx="520" cy="110" r="3"/>
  </g>
</svg>
