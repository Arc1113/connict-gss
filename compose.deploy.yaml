name: graduation-stage-system

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile.deploy
        image: graduation-stage-system-app:deploy
        command:
            - sh
            - -lc
            - >-
                mkdir -p storage/app/public storage/framework/cache/data
                storage/framework/sessions storage/framework/views storage/logs
                && php artisan serve --host=0.0.0.0 --port=8000
        env_file:
            - ${GSS_ENV_FILE:-.env}
        healthcheck:
            test:
                - CMD
                - php
                - -r
                - "exit(@file_get_contents('http://127.0.0.1:8000/up') ? 0 : 1);"
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped
        ports: !override
            - "127.0.0.1:${APP_FORWARD_PORT:-8000}:8000"
        user: root
        volumes: !override
            - gss-storage:/app/storage

    reverb:
        build:
            context: .
            dockerfile: docker/php/Dockerfile.deploy
        image: graduation-stage-system-app:deploy
        command:
            - sh
            - -lc
            - >-
                mkdir -p storage/app/public storage/framework/cache/data
                storage/framework/sessions storage/framework/views storage/logs
                && php artisan reverb:start --host=0.0.0.0 --port=8080
        env_file:
            - ${GSS_ENV_FILE:-.env}
        restart: unless-stopped
        ports: !override
            - "127.0.0.1:${REVERB_FORWARD_PORT:-8080}:8080"
        user: root
        volumes: !override
            - gss-storage:/app/storage

    database:
        restart: unless-stopped

    proxy:
        image: caddy:2.10-alpine
        depends_on:
            app:
                condition: service_healthy
            reverb:
                condition: service_healthy
        environment:
            GSS_HTTPS_HOST: "${GSS_HTTPS_HOST:?Set GSS_HTTPS_HOST in the deployment environment}"
        ports:
            - "${APP_BIND_HOST:-0.0.0.0}:${HTTPS_FORWARD_PORT:-443}:443"
        restart: unless-stopped
        volumes:
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config

volumes:
    gss-storage:
    caddy-data:
    caddy-config:
